name: Django Tests

on:
  push:
    branches:
      - feature/day28-operational-core
      - feature/day29-auth-roles
      - feature/day30-check-in
      - feature/day31-reception-walkins
      - feature/day32-branch-service-capacity
      - feature/day33-counter-lifecycle
      - feature/day34-manager-dashboard
      - feature/day35-disruption-rescheduling
      - feature/day36-queue-event-audit
      - feature/day37-admin-security
      - feature/day38-production-hardening
  pull_request:
    branches:
      - main
      - feature/day28-operational-core
      - feature/day29-auth-roles
      - feature/day30-check-in
      - feature/day31-reception-walkins

jobs:
  sqlite-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django system checks
        run: python manage.py check

      - name: Run account authentication and admin security tests
        run: python manage.py test accounts

      - name: Run branch administration tests
        run: python manage.py test branches

      - name: Run service and capacity tests
        run: python manage.py test services

      - name: Run counter lifecycle tests
        run: python manage.py test counters

      - name: Run queue regression tests
        run: python manage.py test queues

      - name: Run booking/reception tests
        run: python manage.py test bookings

      - name: Run notification reminder tests
        run: python manage.py test notifications

      - name: Run manager dashboard tests
        run: python manage.py test dashboard

      - name: Run disruption and rescheduling tests
        run: python manage.py test rescheduling

      - name: Run queue event audit tests
        run: python manage.py test queues.test_day36_events queues.test_day36_audit_api

      - name: Run full test suite
        run: python manage.py test

  postgres-production:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: smartq
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smartq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SMARTQ_ENV: production
      DJANGO_SECRET_KEY: ci-only-smartq-production-check-secret-key-4827319501
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/smartq
      SECURE_SSL_REDIRECT: "false"
      USE_X_FORWARDED_PROTO: "false"
      SECURE_HSTS_SECONDS: "3600"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Build fresh PostgreSQL database from migrations
        run: python manage.py migrate --noinput

      - name: Run Django production deployment checks
        env:
          SECURE_SSL_REDIRECT: "true"
          USE_X_FORWARDED_PROTO: "true"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
          SECURE_HSTS_PRELOAD: "true"
        run: python manage.py check --deploy --fail-level WARNING

      - name: Run PostgreSQL queue-number concurrency tests
        run: python manage.py test queues.test_day38_queue_numbers.PostgreSQLQueueNumberConcurrencyTests

      - name: Run PostgreSQL slot-capacity concurrency tests
        run: python manage.py test services.test_day38_concurrency.PostgreSQLSlotCapacityConcurrencyTests

      - name: Run full suite on PostgreSQL
        run: python manage.py test

name: Django Tests

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  sqlite-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django system checks
        run: python manage.py check

      - name: Run account authentication and admin security tests
        run: python manage.py test accounts

      - name: Run branch administration tests
        run: python manage.py test branches

      - name: Run service and capacity tests
        run: python manage.py test services

      - name: Run counter lifecycle tests
        run: python manage.py test counters

      - name: Run queue regression tests
        run: python manage.py test queues

      - name: Run booking/reception tests
        run: python manage.py test bookings

      - name: Run notification reminder tests
        run: python manage.py test notifications

      - name: Run manager dashboard tests
        run: python manage.py test dashboard

      - name: Run disruption and rescheduling tests
        run: python manage.py test rescheduling

      - name: Run queue event audit tests
        run: python manage.py test queues.test_day36_events queues.test_day36_audit_api

      - name: Run Day 39 reporting and performance tests
        run: python manage.py test queues.test_day39_reporting

      - name: Run Day 40 final backend audit tests
        run: python manage.py test queues.test_day40_final_audit

      - name: Run Day 41 frontend foundation tests
        run: python manage.py test smartq.test_frontend

      - name: Run Day 42 authentication and app shell tests
        run: python manage.py test smartq.test_day42_frontend_auth

      - name: Run Day 43 customer dashboard tests
        run: python manage.py test smartq.test_day43_customer_dashboard

      - name: Run full test suite
        run: python manage.py test

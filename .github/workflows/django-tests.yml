name: Django Tests

on:
  push:
    branches:
      - feature/day28-operational-core
      - feature/day29-auth-roles
      - feature/day30-check-in
  pull_request:
    branches:
      - main
      - feature/day28-operational-core
      - feature/day29-auth-roles

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django system checks
        run: python manage.py check

      - name: Run account authentication tests
        run: python manage.py test accounts

      - name: Run queue regression tests
        run: python manage.py test queues

      - name: Run booking/check-in tests
        run: python manage.py test bookings

      - name: Run full test suite
        run: python manage.py test

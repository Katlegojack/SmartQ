name: SmartQ ML integration tests

on:
  push:
    branches:
      - main
      - feature/ml-integration
  pull_request:
    branches:
      - main
    paths:
      - "queues/ml_prediction.py"
      - "queues/eligibility.py"
      - "queues/waiting_time.py"
      - "queues/services.py"
      - "queues/api_views.py"
      - "queues/forecasting.py"
      - "queues/models.py"
      - "queues/migrations/0011_queueforecastobservation_ml_prediction.py"
      - "frontend/src/types.ts"
      - "frontend/src/pages/HistoryPage.tsx"
      - "requirements.txt"
      - "smartq/settings.py"
      - ".env.example"
      - "machine_learning/runtime/**"
      - "smartq/test_ml_integration.py"
      - "smartq/test_day58_realtime_service_timing.py"
      - "smartq/test_day59_forecasting_observations.py"
      - "queues/test_day36_events.py"
      - ".github/workflows/ml-integration-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run ML integration tests
        run: python manage.py test smartq.test_ml_integration
      - name: Run ETA regression tests
        run: python manage.py test smartq.test_day58_realtime_service_timing
      - name: Run forecasting regression tests
        run: python manage.py test smartq.test_day59_forecasting_observations

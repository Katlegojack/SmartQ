{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Sign in to Smart Q.">
    <title>Sign in | Smart Q</title>
    <link rel="stylesheet" href="{% static 'css/smartq.css' %}">
    <link rel="stylesheet" href="{% static 'css/auth-shell.css' %}">
    <script type="module" src="{% static 'js/pages/login.js' %}" defer></script>
</head>
<body class="auth-page">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="topbar">
        <div class="topbar__inner container">
            <a class="brand" href="/" aria-label="Smart Q home">
                <span class="brand__mark" aria-hidden="true">SQ</span>
                <span class="brand__text"><strong>Smart Q</strong><small>Where Time Meets Priority</small></span>
            </a>
            <a class="nav-link" href="/register/">Create account</a>
        </div>
    </header>

    <main class="auth-main" id="main-content">
        <div class="container auth-layout">
            <section class="auth-intro" aria-labelledby="login-heading">
                <p class="eyebrow">Smart Q</p>
                <h1 id="login-heading">Sign in</h1>
                <p>Customers and staff use the same sign-in.</p>
            </section>

            <section class="auth-card" aria-label="Sign-in form">
                <div class="auth-card__header">
                    <h2>Welcome back</h2>
                </div>
                <div class="form-message" data-form-message hidden role="status" aria-live="polite"></div>
                <form class="form-stack" data-login-form novalidate>
                    <label class="field">
                        <span class="field__label">Username</span>
                        <input class="input" type="text" name="username" autocomplete="username" required autofocus>
                    </label>
                    <label class="field">
                        <span class="field__label">Password</span>
                        <input class="input" type="password" name="password" autocomplete="current-password" required>
                    </label>
                    <button class="btn btn--primary btn--block" type="submit">Sign in</button>
                </form>
                <p class="auth-card__footer">New customer? <a href="/register/">Create an account</a>.</p>
            </section>
        </div>
    </main>
</body>
</html>
